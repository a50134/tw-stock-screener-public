name: 總回測（10 年全市場資料，research/full_bt.py）
on:
  workflow_dispatch:
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy
      - run: git fetch -q --depth 1 origin hist-data && git worktree add -q /tmp/h FETCH_HEAD
      - run: python -W ignore research/full_bt.py /tmp/h/hist
      - run: python -W ignore research/rev_bt.py /tmp/h/hist

name: 期貨選擇權大戶動向回測（外資台指期、散戶多空比、P/C 比）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - run: python research/futopt_bt.py

name: 情境機率回測（能不能讓推薦名單更準）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: git fetch -q --depth 1 origin site-data && git show FETCH_HEAD:data.json > data.json
      - run: node research/strat_hits.js data.json hits.json && python research/odds_bt.py data.json hits.json sop_config.json

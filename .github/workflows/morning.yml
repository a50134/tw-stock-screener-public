name: 開盤檢查（每日 SOP 步驟 ④）

on:
  schedule:
    - cron: '17 0 * * 1-5'  # 台灣時間 08:17 啟動（避開整點並預留 GitHub 延遲），程式會等到 09:01 開盤後抓價，09:05 前發送
  workflow_dispatch:
    inputs:
      test:
        description: '測試：立刻用目前價格判斷，只印結果不發送'
        type: boolean
        default: true

permissions:
  contents: write

concurrency: morning-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      LINE_BROADCAST: '1'   # 發給官方帳號所有好友（家人加好友就收得到）；改成 '0' 只發給自己
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}   # 讀寫私人專案（持股、買賣紀錄）
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 取最新版（排隊等候期間前一次執行可能已存入「今天已發送」的記錄）
      - name: 取私人資料（持股、買賣紀錄放在私人專案，不公開）
        if: env.PRIVATE_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: a50134/tw-stock-screener
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: priv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 併入私人資料
        run: '[ -f priv/sop_config.json ] && python private_sync.py pull priv || echo "沒有私人資料（還沒設定 PRIVATE_REPO_TOKEN），持股提醒略過"'
      - run: pip install requests pillow
      - name: 安裝中文字型（開盤圖卡用）
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk) >/dev/null || echo "字型安裝失敗，LINE 改發文字"
      - name: 測試開盤前觀察的資料來源（只在手動測試時）
        if: inputs.test
        run: python premarket.py --debug || true
      - run: python morning_check.py ${{ inputs.test && '--now --dry-run --force' || '' }}
      - name: 記錄今天已發送
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f sent_state.json ]; then git add -f sent_state.json; fi
          git commit -m "記錄開盤檢查已發送" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done

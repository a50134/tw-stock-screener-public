name: 跌深反彈回測（11/20 節目）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: git fetch -q --depth 1 origin site-data && git show FETCH_HEAD:data.json > data.json
      - run: python research/nov20_bt.py data.json

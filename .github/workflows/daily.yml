name: 每日選股報告

on:
  schedule:
    - cron: '3 13 * * *'   # 每天台灣時間 21:03 開始（避開整點：GitHub 整點排程常延遲或被跳過）
  workflow_dispatch:        # 也可以在 GitHub 網頁上手動執行
    inputs:
      force:
        description: '強制發送（休市也發）'
        type: boolean
        default: false
      dry:
        description: '只抓資料、更新網頁資料，不發送報告'
        type: boolean
        default: false

permissions:
  contents: write   # 把隔天早上開盤檢查要用的名單（sop_plan.json）存回專案

concurrency: daily-report   # 同時間只跑一份

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 清單＋全市場粗篩約 270 檔，FinMind 每小時額度用完會等待，可能要 3 小時左右
    outputs:
      site: ${{ steps.site.outcome }}   # 有打包網站（當天有新資料）才發佈
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      # 金鑰存在 GitHub 專案的 Settings → Secrets and variables → Actions
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      LINE_BROADCAST: '1'   # 發給官方帳號所有好友（家人加好友就收得到）；改成 '0' 只發給自己
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}   # 讀寫私人專案（持股、買賣紀錄）
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 取最新版（排隊等候期間前一次執行可能已存入「今天已發送」的記錄）
      - name: 取私人資料（持股、買賣紀錄放在私人專案，不公開）
        if: env.PRIVATE_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: a50134/tw-stock-screener
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: priv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 併入私人資料
        run: '[ -f priv/sop_config.json ] && python private_sync.py pull priv || echo "沒有私人資料（還沒設定 PRIVATE_REPO_TOKEN），持股提醒略過"'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install requests pillow
      - name: 安裝中文字型（總表圖片用）
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk) >/dev/null || echo "字型安裝失敗，總表圖片會略過"
      - run: npm ci
      - name: 取上一份資料當快取（月營收、季財報非公布期間沿用，少抓約 1/3）
        run: git fetch -q --depth 1 origin site-data && git show FETCH_HEAD:data.json > data_prev.json || echo "沒有上一份資料，全部重抓"
      - name: 全市場行情（網頁查詢任何一檔用、判斷大盤強弱；失敗不影響報告）
        run: |
          git fetch -q --depth 1 origin site-data && (git show FETCH_HEAD:market_hist.json > market_hist.json || { rm -f market_hist.json; echo "沒有全市場快取"; })
          git show FETCH_HEAD:tdcc_hist.json > tdcc_hist.json 2>/dev/null || { rm -f tdcc_hist.json; echo "還沒有集保大戶歷史，今晚開始累積"; }
          python market.py --days 10 || echo "全市場行情更新失敗，沿用上一份"
      - run: python daily_run.py ${{ inputs.force && '--force' || '' }} ${{ inputs.dry && '--dry-run' || '' }}
      - name: 保存隔天早上開盤檢查的名單
        if: success() && !inputs.dry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in sop_plan.json sent_state.json; do [ -f "$f" ] && git add -f "$f" || true; done   # 持股相關的存回私人專案（下一步）
          git commit -m "更新開盤檢查名單" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
      - name: 存回私人資料（持股賣出計畫、復盤教訓）
        if: success() && !inputs.dry && hashFiles('priv/sop_config.json') != ''
        run: |
          python private_sync.py push priv
          cd priv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新持股賣出計畫" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
      - name: 保存網頁版要用的最新資料（site-data 分支，只留最新一份）
        if: success() && hashFiles('data.json') != ''
        run: |
          python - <<'EOF'
          import json, os
          d = json.load(open("data.json", encoding="utf-8"))
          if os.path.exists("macro.json"):  # 國際新聞併進 data.json，網頁只需要載入一個檔
              d["macro"] = json.load(open("macro.json", encoding="utf-8")).get("macro", [])
          os.makedirs("/tmp/site-data", exist_ok=True)
          json.dump(d, open("/tmp/site-data/data.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("網頁資料：", d.get("asOf"), len(d["stocks"]), "檔")
          EOF
          [ -f market_hist.json ] && cp market_hist.json /tmp/site-data/ || true
          [ -f tdcc_hist.json ] && cp tdcc_hist.json /tmp/site-data/ || true   # 集保大戶每週歷史（開放資料只有最新一週，要自己存）
          git fetch -q --depth 1 origin site-data || true   # 重抓一次（前面存檔步驟的 git pull 會蓋掉 FETCH_HEAD）
          # 歷史圖卡：沿用上一份，加上今晚的圖，只留最近約一個月
          (git archive FETCH_HEAD cards | tar -x -C /tmp/site-data) 2>/dev/null || true
          python cards.py /tmp/site-data/cards || echo "歷史圖卡更新失敗，不影響報告"
          # 今晚全市場沒更新成功就沿用上一份（不讓網頁查詢壞掉）
          if [ -d site_m ]; then cp -r site_m /tmp/site-data/m; else (git archive FETCH_HEAD m | tar -x -C /tmp/site-data) 2>/dev/null || true; fi
          cd /tmp/site-data
          git init -q -b site-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "網頁資料 $(date +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-data
      - name: 打包網站（手機 App 版，含今天的真實資料）
        id: site
        if: success() && hashFiles('data.json') != ''   # 休市沒抓資料時不更新網站，保留上一版
        run: python build_site.py site
      - name: 上傳網站
        if: steps.site.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 保存執行紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 14

  # 發佈到 GitHub Pages：要先在 Settings → Pages → Source 選「GitHub Actions」
  # 沒開或不支援時只有這一步失敗，不影響上面的每日報告
  pages:
    needs: report
    if: needs.report.outputs.site == 'success'   # 休市沒資料就不跑，避免顯示失敗
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
